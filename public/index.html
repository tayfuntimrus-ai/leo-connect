function renderHome(){const h=(sec('hero').items||[])[0]||{},p=sec('platform'),how=sec('how-it-works'),st=sec('stands');const hc=how.items||[],pc=p.items||[],cats=categories();const hs=cfg('hero','home_stats',[]),trust=cfg('hero','home_trust',[]);return `<div class="home-hero"><div class="wrap home-hero-grid"><div class="home-hero-copy"><div class="eyebrow">${esc(itemContent(h).badge||'LEO CONNECT • QR + NFC')}</div><h1>${esc(h.title||'İşletmenizi tek dokunuşla dijitale taşıyın.')}</h1><p class="lead">${esc(h.description||h.short_text||'QR ve NFC teknolojisiyle işletmenizin fiziksel temas noktalarını güçlü bir dijital deneyime dönüştürün.')}</p><div class="actions"><a class="btn gold" href="/iletisim" data-route>${esc(h.button_text||'Hemen Başlayalım')} <span>→</span></a><a class="btn" href="/urunler" data-route>${esc(cfg('hero','home_hero_secondary','Ürünleri Keşfet'))}</a></div><div class="hero-proof"><span><b>QR</b> ${esc(cfg('hero','proof_qr','Anında erişim'))}</span><span><b>NFC</b> ${esc(cfg('hero','proof_nfc','Tek dokunuş'))}</span><span><b>WEB</b> ${esc(cfg('hero','proof_web','Tek merkez'))}</span></div></div><div class="home-hero-visual"><div class="visual-glow"></div><div class="device-card"><div class="device-top"><span>LEO CONNECT</span><i>● LIVE</i></div><div class="device-screen"><div class="device-lion"></div><strong>${esc(cfg('hero','device_title','Dijital Profil'))}</strong><small>${esc(cfg('hero','device_subtitle','QR + NFC deneyimi'))}</small><div class="device-links"><span>Instagram</span><span>WhatsApp</span><span>Google</span></div></div><div class="device-foot"><span>● NFC READY</span><span>QR ACTIVE</span></div></div><div class="floating-chip chip-one">✦ QR + NFC</div><div class="floating-chip chip-two">01 / Dijital Deneyim</div></div></div><div class="home-trust"><div class="wrap trust-grid">${(Array.isArray(trust)?trust:[]).slice(0,4).map(x=>`<div><strong>${esc(x.title)}</strong><span>${esc(x.text)}</span></div>`).join('')}</div></div><section class="section home-intro"><div class="wrap split intro-split"><div><div class="eyebrow">${esc(cfg('hero','home_intro_eyebrow','LEO CONNECT NEDİR?'))}</div><h2>${esc(cfg('hero','home_intro_title','Fiziksel işletmenizi dijital bir deneyime dönüştürün.'))}</h2><p>${esc(cfg('hero','home_intro_text','LEO CONNECT; QR, NFC, dijital profil, bağlantılar, kampanyalar ve işletme yönetimini tek bir sistemde buluşturur. Müşterinizin ihtiyaç duyduğu bilgiye ulaşması için gereken adımları azaltır.'))}</p><a class="text-link" href="/platform" data-route>${esc(cfg('hero','home_intro_link','Platformu keşfet →'))}</a></div><div class="intro-stat-grid">${(Array.isArray(hs)?hs:[]).slice(0,4).map(x=>`<article><b>${esc(x.no)}</b><strong>${esc(x.title)}</strong><span>${esc(x.text)}</span></article>`).join('')}</div></div></section><section class="section home-platform"><div class="wrap"><div class="sectionhead home-sectionhead"><div><div class="eyebrow">${esc(cfg('platform','home_eyebrow','PLATFORM'))}</div><h2>${esc(p.subtitle||'Bir QR’dan çok daha fazlası.')}</h2></div><a class="btn" href="/platform" data-route>${esc(cfg('platform','home_button','Tüm platformu gör →'))}</a></div><div class="grid home-feature-grid">${pc.slice(0,6).map((x,i)=>`<article class="card feature-card"><div class="feature-number">0${i+1}</div><h3>${esc(x.title)}</h3><p>${esc(x.short_text||x.description)}</p><span class="feature-arrow">↗</span></article>`).join('')}</div></div></section><section class="section home-process"><div class="wrap"><div class="sectionhead"><div class="eyebrow">${esc(cfg('how-it-works','how_eyebrow','NASIL ÇALIŞIR?'))}</div><h2>${esc(how.subtitle||'Fiziksel temas. Dijital deneyim.')}</h2><p>${esc(how.description||'Sade bir kurulum, hızlı bir dijital geçiş ve merkezi yönetim.')}</p></div><div class="process-grid">${hc.slice(0,3).map((x,i)=>`<article><div class="process-no">0${i+1}</div><div><h3>${esc(x.title)}</h3><p>${esc(x.short_text||x.description)}</p></div></article>`).join('')}</div><div class="process-action"><a class="btn" href="/nasil-calisir" data-route>${esc(cfg('how-it-works','how_action','Nasıl çalıştığını detaylı incele →'))}</a></div></div></section><section class="section home-products"><div class="wrap"><div class="sectionhead home-sectionhead"><div><div class="eyebrow">${esc(cfg('hero','home_products_eyebrow','ÜRÜNLER'))}</div><h2>${esc(cfg('hero','home_products_title','Markanıza uygun fiziksel deneyimi seçin.'))}</h2><p>${esc(st.description||'Masa standları, NFC ürünleri ve özel tasarım çözümleri.')}</p></div><a class="btn gold" href="/urunler" data-route>${esc(cfg('hero','home_products_button','Tüm ürünler'))}</a></div><div class="category-grid home-category-grid">${cats.slice(0,3).map((c,i)=>`<article class="category home-category" onclick="go('/${categorySlug(c)}')"><div class="category-top"><span>0${i+1}</span><em>${productsOf(c).length} ÜRÜN</em></div><h2>${esc(c.title)}</h2><p>${esc(c.short_text||c.description||'Kategori ürünlerini inceleyin.')}</p><span class="category-link">Koleksiyonu keşfet <b>→</b></span></article>`).join('')}</div></div></section><section class="section home-final-cta"><div class="wrap"><div class="cta cta-premium"><div><div class="eyebrow">${esc(cfg('hero','home_cta_eyebrow','LEO CONNECT'))}</div><h2>${esc(cfg('hero','home_cta_title','İşletmenizin dijital temas noktalarını yeniden tasarlayalım.'))}</h2><p>${esc(cfg('hero','home_cta_text','İhtiyacınızı anlatın; QR, NFC ve fiziksel ürünlerden oluşan size özel deneyimi birlikte planlayalım.'))}</p></div><div class="actions"><a class="btn gold" href="/iletisim" data-route>${esc(cfg('hero','home_cta_primary','Projenizi Konuşalım →'))}</a><a class="btn" href="/urunler" data-route>${esc(cfg('hero','home_cta_secondary','Ürünleri İncele'))}</a></div></div></div></section>`}
function renderPlatform(){const p=sec('platform');const items=p.items||[];return layout(p.subtitle||'Dijital temas noktalarınız tek merkezde.','LEO CONNECT • PLATFORM',p.description||'QR ve NFC deneyimini işletmenizin tüm dijital bağlantılarıyla birleştirin.',`<section class="section"><div class="wrap"><div class="grid">${items.map((x,i)=>{const c=itemContent(x);return `<article class="card"><div class="iconbox">0${i+1}</div><h3>${esc(x.title)}</h3><p>${esc(x.description||x.short_text)}</p>${Array.isArray(c.features)?`<div class="checklist">${c.features.map(v=>`<div class="check"><b>✓</b><span>${esc(v)}</span></div>`).join('')}</div>`:''}</article>`}).join('')}</div></div></section><section class="section" style="padding-top:0"><div class="wrap split"><div class="panel"><div class="eyebrow">${esc(cfg('platform','platform_panel_1_eyebrow','TEK DENEYİM'))}</div><h2>${esc(cfg('platform','platform_panel_1_title','QR + NFC + profil.'))}</h2><p>${esc(cfg('platform','platform_panel_1_text','Müşterinin fiziksel bir noktadan dijital dünyanıza geçişini mümkün olduğunca kısa ve anlaşılır hale getirin.'))}</p></div><div class="panel"><div class="eyebrow">${esc(cfg('platform','platform_panel_2_eyebrow','ÖLÇÜLEBİLİR'))}</div><h2>${esc(cfg('platform','platform_panel_2_title','Etkileşimi görün.'))}</h2><p>${esc(cfg('platform','platform_panel_2_text','İşletme panelinizde QR, NFC ve dijital temas noktalarından gelen hareketleri takip edin.'))}</p></div></div></section>`)}
function renderHow(){const h=sec('how-it-works');return layout(h.subtitle||'Fiziksel temas. Dijital deneyim.','LEO CONNECT • NASIL ÇALIŞIR?',h.description||'Kurulumdan müşterinin ilk dokunuşuna kadar sade ve hızlı bir akış.',`<section class="section"><div class="wrap"><div class="grid">${(h.items||[]).map((x,i)=>`<article class="card"><div class="iconbox">0${i+1}</div><h3>${esc(x.title)}</h3><p>${esc(x.description||x.short_text)}</p></article>`).join('')}</div></div></section><section class="section" style="padding-top:0"><div class="wrap panel"><div class="eyebrow">${esc(cfg('how-it-works','how_bottom_eyebrow','İŞLETME DENEYİMİ'))}</div><h2>${esc(cfg('how-it-works','how_bottom_title','Kurulumdan sonra yönetim sizde.'))}</h2><p>${esc(cfg('how-it-works','how_bottom_text','Profil bilgileri, dijital bağlantılar, kampanyalar, QR/NFC erişimleri ve analizler işletme paneliniz üzerinden yönetilebilir.'))}</p><div class="actions"><a class="btn gold" href="/iletisim" data-route>${esc(cfg('how-it-works','how_bottom_primary','Bilgi Al'))}</a><a class="btn" href="/urunler" data-route>${esc(cfg('how-it-works','how_bottom_secondary','Ürünleri Gör'))}</a></div></div></section>`)}
function renderProducts(){const cs=categories();return layout('Fiziksel deneyiminizi tamamlayan çözümler.','LEO CONNECT • ÜRÜNLER','Masa standlarından NFC ürünlerine ve özel tasarımlara kadar markanıza uygun çözümleri keşfedin.',`<section class="section"><div class="wrap"><div class="category-grid">${cs.map(c=>`<article class="category" onclick="go('/${categorySlug(c)}')"><div class="count">${productsOf(c).length} ÜRÜN</div><h2 style="font-size:30px">${esc(c.title)}</h2><p>${esc(c.short_text||c.description||'Kategori ürünlerini inceleyin.')}</p><span class="btn">Ürünleri Gör →</span></article>`).join('')}</div></div></section>`)}
function renderCategory(c){const ps=productsOf(c);return layout(c.title,'LEO CONNECT • ÜRÜN KATEGORİSİ',c.description||c.short_text||'Bu kategorideki ürünleri inceleyin.',`<section class="section"><div class="wrap"><a class="back" href="/urunler" data-route>← Tüm ürünler</a><div class="product-grid">${ps.length?ps.map(p=>{const pc=itemContent(p);return `<article class="product" onclick="go('/${categorySlug(c)}/${productSlug(p)}')"><div class="product-img">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.title)}" onerror="this.style.display='none'">`:'<div class="lion" style="width:80px;height:80px"></div>'}</div><div class="product-body">${pc.badge?`<span class="product-badge">${esc(pc.badge)}</span>`:''}<h3>${esc(p.title)}</h3><p>${esc(p.short_text||p.description||'')}</p><div class="specs">${[pc.material,pc.dimensions,pc.color].filter(Boolean).map(v=>`<span>${esc(v)}</span>`).join('')}</div></div></article>`}).join(''):'<div class="panel" style="grid-column:1/-1"><h3>Bu kategoride henüz ürün bulunmuyor.</h3><p>Yeni ürünler yakında burada yayınlanacak.</p></div>'}</div></div></section>`)}
function renderContact(){const s=websiteData.settings||{},c=sec('contact'),rows=[['E-posta',s.contact_email],['Telefon',s.contact_phone],['WhatsApp',s.contact_whatsapp],['Instagram',s.contact_instagram],['Facebook',s.contact_facebook],['LinkedIn',s.contact_linkedin],['Adres',s.contact_address],['Çalışma saatleri',s.contact_hours]].filter(x=>x[1]);return layout(c.subtitle||'LEO CONNECT ile tanışın.','LEO CONNECT • İLETİŞİM',c.description||'İşletmeniz için doğru QR + NFC çözümünü birlikte tasarlayalım.',`<section class="section"><div class="wrap contact"><div class="contact-card"><div class="eyebrow">${esc(cfg('contact','contact_card_eyebrow','BİRLİKTE TASARLAYALIM'))}</div><h2>${esc(cfg('contact','contact_card_title','İşletmeniz için doğru çözümü oluşturalım.'))}</h2><p>${esc(cfg('contact','contact_card_text','İhtiyacınızı, ürün tipini ve kullanım alanını anlatın. Size uygun LEO CONNECT deneyimini birlikte planlayalım.'))}</p><div class="actions"><a class="btn gold" href="${esc(s.contact_whatsapp?('https://wa.me/'+String(s.contact_whatsapp).replace(/\D/g,'')):'#')}" target="_blank" rel="noopener">${esc(cfg('contact','contact_button',"WhatsApp'tan Yaz"))}</a></div></div><div class="contact-card"><div class="eyebrow">${esc(cfg('contact','contact_info_eyebrow','İLETİŞİM BİLGİLERİ'))}</div><div class="contact-list">${rows.length?rows.map(r=>`<div class="contact-item"><small>${esc(r[0])}</small><strong>${esc(r[1])}</strong></div>`).join(''):'<div class="contact-item"><strong>İletişim bilgileri yakında yayınlanacak.</strong></div>'}</div></div></div></section>`)}
function openProductDetail(c,p){const pc=itemContent(p);$('detailBadge').textContent=pc.badge||c.title||'LEO CONNECT';$('detailTitle').textContent=p.title||'Ürün';$('detailDescription').textContent=p.description||p.short_text||'';$('detailPrice').textContent=pc.price||'';const specs=[['Malzeme',pc.material],['Ölçü',pc.dimensions],['Renk',pc.color]].filter(x=>x[1]);$('detailSpecs').innerHTML=specs.map(x=>`<div class="detail-spec"><small>${esc(x[0])}</small><strong>${esc(x[1])}</strong></div>`).join('');$('detailFeatures').innerHTML=(Array.isArray(pc.features)?pc.features:[]).map(v=>`<li>${esc(v)}</li>`).join('');const gallery=[p.image_url,...(Array.isArray(pc.gallery)?pc.gallery:[])].filter(Boolean);$('detailMain').src=gallery[0]||'';$('detailMain').style.display=gallery[0]?'block':'none';$('detailThumbs').innerHTML=gallery.map(g=>`<button onclick="$('detailMain').src='${esc(g)}'"><img src="${esc(g)}" alt=""></button>`).join('');$('detailActions').innerHTML=p.button_url?`<a class="btn gold" href="${esc(p.button_url)}" target="_blank" rel="noopener">${esc(p.button_text||'Bilgi Al')}</a>`:'';$('productDetailBackdrop').classList.add('open');document.body.style.overflow='hidden'}function closeProductDetail(){$('productDetailBackdrop').classList.remove('open');document.body.style.overflow=''}
function renderProductPage(c,p){const pc=itemContent(p);const gallery=[p.image_url,...(Array.isArray(pc.gallery)?pc.gallery:[])].filter(Boolean);const specs=[['Malzeme',pc.material],['Ölçü',pc.dimensions],['Renk',pc.color]].filter(x=>x[1]);return layout(p.title,'LEO CONNECT • ÜRÜN',p.description||p.short_text||'Ürün detayları',`<section class="section"><div class="wrap"><a class="back" href="/${categorySlug(c)}" data-route>← ${esc(c.title)}</a><div class="split"><div class="panel" style="padding:14px"><div class="product-img" style="height:520px;border-radius:18px">${gallery[0]?`<img src="${esc(gallery[0])}" alt="${esc(p.title)}" onerror="this.style.display='none'">`:'<div class="lion" style="width:110px;height:110px"></div>'}</div>${gallery.length>1?`<div class="thumbs" style="margin:12px 0 0">${gallery.map(g=>`<button onclick="this.closest('.panel').querySelector('.product-img img').src='${esc(g)}'"><img src="${esc(g)}" alt=""></button>`).join('')}</div>`:''}</div><div class="panel"><div class="eyebrow">${esc(pc.badge||c.title)}</div><h2>${esc(p.title)}</h2><p class="lead">${esc(p.description||p.short_text||'')}</p>${pc.price?`<div class="price">${esc(pc.price)}</div>`:''}<div class="detail-specs">${specs.map(x=>`<div class="detail-spec"><small>${esc(x[0])}</small><strong>${esc(x[1])}</strong></div>`).join('')}</div>${Array.isArray(pc.features)&&pc.features.length?`<div class="checklist">${pc.features.map(v=>`<div class="check"><b>✓</b><span>${esc(v)}</span></div>`).join('')}</div>`:''}${p.button_url?`<div class="actions"><a class="btn gold" href="${esc(p.button_url)}" target="_blank" rel="noopener">${esc(p.button_text||'Bilgi Al')}</a></div>`:''}</div></div></div></section>`)}
function findRoute(path){const clean=path.replace(/\/$/,'')||'/';if(clean==='/')return {type:'home'};if(clean==='/platform')return {type:'platform'};if(clean==='/nasil-calisir')return {type:'how'};if(clean==='/urunler')return {type:'products'};if(clean==='/iletisim')return {type:'contact'};const parts=clean.split('/').filter(Boolean);const c=categories().find(x=>categorySlug(x)===parts[0]);if(c&&parts.length===1)return {type:'category',c};if(c&&parts.length>=2){const p=productsOf(c).find(x=>productSlug(x)===parts[1]);if(p)return {type:'product',c,p}}return {type:'404'}}
function renderRoute(){const path=location.pathname;const r=findRoute(path);setActive(r.type==='products'||r.type==='category'||r.type==='product'?'/urunler':path);let out='';if(r.type==='home')out=renderHome();else if(r.type==='platform')out=renderPlatform();else if(r.type==='how')out=renderHow();else if(r.type==='products')out=renderProducts();else if(r.type==='contact')out=renderContact();else if(r.type==='category')out=renderCategory(r.c);else if(r.type==='product')out=renderProductPage(r.c,r.p);else out=layout('Sayfa bulunamadı.','LEO CONNECT • 404','Aradığınız sayfa bulunamadı.',`<section class="section"><div class="wrap"><a class="btn gold" href="/" data-route>Ana sayfaya dön</a></div></section>`);$('app').innerHTML=out;window.scrollTo(0,0);$('mobileNav').style.display='none'}function go(path){if(path===location.pathname){renderRoute();return}history.pushState({},'',path);renderRoute()}function toggleMobile(){const x=$('mobileNav');x.style.display=x.style.display==='none'?'block':'none'}document.addEventListener('click',e=>{const a=e.target.closest('a[data-route]');if(!a)return;e.preventDefault();go(new URL(a.href,location.origin).pathname)});window.addEventListener('popstate',renderRoute);(async()=>{await loadSite();renderRoute()})();
</script>
</body></html>
