<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LEO CONNECT • Digital Business Card</title>
<style>
:root{--bg:#070807;--panel:#101211;--panel2:#151816;--line:#292d2b;--text:#f5f5ef;--muted:#9fa59f;--gold:#d4af37;--gold2:#f0d77b;--shadow:0 30px 80px rgba(0,0,0,.38)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#191b17 0,#070807 45%,#040504 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}a{text-decoration:none;color:inherit}.wrap{width:min(720px,100%);margin:0 auto;padding:28px 16px 44px}.card{overflow:hidden;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border-radius:30px;box-shadow:var(--shadow);backdrop-filter:blur(16px)}.cover{height:210px;background:linear-gradient(135deg,#191b18,#0b0c0b);position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.82) 100%)}.cover-logo{position:absolute;z-index:2;left:50%;bottom:-42px;transform:translateX(-50%);width:92px;height:92px;border-radius:26px;border:2px solid rgba(212,175,55,.75);background:#0b0c0b;display:grid;place-items:center;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.5)}.cover-logo img{width:100%;height:100%;object-fit:cover}.cover-logo span{font-size:42px}.content{padding:62px 22px 26px;text-align:center}.eyebrow{font-size:10px;letter-spacing:.22em;color:var(--gold);font-weight:800}.name{font-size:34px;line-height:1.05;margin:9px 0 6px}.person{font-size:16px;font-weight:700}.job{font-size:13px;color:var(--muted);margin-top:4px}.note{font-size:14px;line-height:1.6;color:#c7cbc6;max-width:570px;margin:15px auto 0}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:22px}.action{min-height:54px;border:1px solid var(--line);border-radius:16px;background:var(--panel);display:flex;align-items:center;justify-content:center;gap:9px;font-weight:750;font-size:13px;transition:.18s}.action:hover{transform:translateY(-2px);border-color:rgba(212,175,55,.55)}.action.gold{background:linear-gradient(135deg,#d4af37,#f0d77b);color:#17140a;border:0}.section{margin-top:14px;padding:18px;text-align:left;border:1px solid var(--line);border-radius:20px;background:rgba(0,0,0,.16)}.section-title{font-size:11px;color:var(--gold);letter-spacing:.16em;font-weight:850;margin-bottom:11px}.rows{display:grid;gap:8px}.row{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--panel2);border:1px solid rgba(255,255,255,.045)}.icon{width:34px;height:34px;border-radius:11px;background:#0c0e0d;display:grid;place-items:center;font-size:16px}.row-main{min-width:0}.row-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.row-value{font-size:13px;font-weight:700;overflow-wrap:anywhere;margin-top:2px}.footer{text-align:center;color:#6f756f;font-size:10px;letter-spacing:.12em;margin-top:22px}.hidden{display:none!important}@media(max-width:520px){.wrap{padding:12px 10px 30px}.cover{height:185px}.name{font-size:29px}.actions{grid-template-columns:1fr}.content{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div class="wrap">
  <main id="app" class="card">
    <div id="cover" class="cover"><div id="logo" class="cover-logo"><span>🦁</span></div></div>
    <div class="content">
      <div class="eyebrow">LEO CONNECT • DIGITAL BUSINESS CARD</div>
      <h1 id="name" class="name">Yükleniyor…</h1>
      <div id="person" class="person"></div><div id="job" class="job"></div><p id="note" class="note"></p>
      <div id="actions" class="actions"></div>
      <section id="contactSection" class="section hidden"><div class="section-title">İLETİŞİM & BAĞLANTILAR</div><div id="rows" class="rows"></div></section>
      <div class="footer">POWERED BY LEO CONNECT</div>
    </div>
  </main>
</div>
<script>
const slug=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');
let payload=null;
const fieldMeta={
 display_name:['Kart Başlığı / İşletme Adı',''],person_name:['Yetkili / Kişi Adı',''],job_title:['Unvan',''],phone:['Telefon','business_card_phone'],whatsapp:['WhatsApp','business_card_whatsapp'],email:['E-posta','business_card_email'],website:['Web Sitesi','business_card_website'],address:['Adres','business_card_location'],instagram:['Instagram','business_card_instagram'],facebook:['Facebook','business_card_facebook'],tiktok:['TikTok','business_card_tiktok'],linkedin:['LinkedIn','business_card_linkedin'],google_review:['Google Yorum',''],menu:['Menü',''],iban:['IBAN','business_card_iban'],iban_holder:['IBAN Sahibi',''],hours:['Çalışma Saatleri',''],note:['Not / Kısa Açıklama','']
};
const icon={phone:'📞',whatsapp:'💬',email:'✉️',website:'🌐',address:'📍',instagram:'◎',facebook:'f',tiktok:'♪',linkedin:'in',google_review:'⭐',menu:'☰',iban:'🏦',hours:'🕐'};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function event(type){try{fetch('/api/event/'+encodeURIComponent(slug),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type})}).catch(()=>{})}catch(e){}}
function safeUrl(v){try{const u=new URL(String(v||''));return ['http:','https:'].includes(u.protocol)?u.href:''}catch(e){return ''}}
function row(key,value){const meta=fieldMeta[key]||[key,''];if(!value)return '';const url=safeUrl(value);let html=esc(value);if(url)html=`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(value)}</a>`;if(key==='phone')html=`<a href="tel:${esc(value)}">${esc(value)}</a>`;if(key==='email')html=`<a href="mailto:${esc(value)}">${esc(value)}</a>`;return `<div class="row"><div class="icon">${icon[key]||'•'}</div><div class="row-main"><div class="row-label">${esc(meta[0])}</div><div class="row-value">${html}</div></div></div>`}
function vcard(){const d=payload.card.data||{},b=payload.business||{};const lines=['BEGIN:VCARD','VERSION:3.0',`FN:${(d.person_name||d.display_name||b.name||'').replace(/([\\,;])/g,'\\$1')}`];if(d.job_title)lines.push(`TITLE:${d.job_title.replace(/([\\,;])/g,'\\$1')}`);if(d.phone)lines.push(`TEL;TYPE=CELL:${d.phone}`);if(d.email)lines.push(`EMAIL:${d.email}`);if(d.website)lines.push(`URL:${d.website}`);if(d.address)lines.push(`ADR:;;${d.address.replace(/([\\,;])/g,'\\$1')}`);lines.push('END:VCARD');return lines.join('\r\n')}
function downloadVCard(){const blob=new Blob([vcard()],{type:'text/vcard;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(payload.card.data.display_name||payload.business.name||'business-card')+'.vcf';a.click();URL.revokeObjectURL(url);event('business_card_vcard')}
function render(){const b=payload.business||{},d=payload.card.data||{};document.title=(d.display_name||b.name||'Business Card')+' • LEO CONNECT';document.getElementById('name').textContent=d.display_name||b.name||'Business Card';document.getElementById('person').textContent=d.person_name||'';document.getElementById('job').textContent=d.job_title||'';document.getElementById('note').textContent=d.note||'';if(b.logo_url){document.getElementById('logo').innerHTML=`<img src="${esc(b.logo_url)}" alt="Logo">`}const actions=[];if(d.phone)actions.push(`<a class="action gold" href="tel:${esc(d.phone)}" onclick="event('business_card_phone')">📞 Ara</a>`);if(d.whatsapp)actions.push(`<a class="action" href="${esc(d.whatsapp.startsWith('http')?d.whatsapp:'https://wa.me/'+d.whatsapp.replace(/\D/g,''))}" target="_blank" rel="noopener" onclick="event('business_card_whatsapp')">💬 WhatsApp</a>`);actions.push(`<button class="action" onclick="downloadVCard()">👤 Kişilere Ekle</button>`);if(navigator.share)actions.push(`<button class="action" onclick="shareCard()">↗ Paylaş</button>`);document.getElementById('actions').innerHTML=actions.join('');const order=['email','website','address','instagram','facebook','tiktok','linkedin','google_review','menu','iban','iban_holder','hours'];const rows=order.map(k=>row(k,d[k])).filter(Boolean);if(rows.length){document.getElementById('rows').innerHTML=rows.join('');document.getElementById('contactSection').classList.remove('hidden')}}
async function shareCard(){try{await navigator.share({title:document.title,text:'Digital Business Card',url:location.href});event('business_card_share')}catch(e){}}
async function init(){try{const r=await fetch('/api/public-business-card/'+encodeURIComponent(slug));if(!r.ok)throw new Error('Kart bulunamadı');payload=await r.json();render()}catch(e){document.getElementById('name').textContent='Business Card kullanılamıyor';document.getElementById('note').textContent=e.message||'Bir hata oluştu.'}}
init();
</script>
</body>
</html>
