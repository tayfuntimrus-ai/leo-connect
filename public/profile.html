<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>LEO CONNECT</title>

  <link rel="stylesheet" href="/style.css">

  <style>

    .profile-wrap{
      width:min(520px,92%);
      margin:auto;
    }

    .profile-box{
      background:#fff;
      border-radius:24px;
      padding:32px 24px;
      text-align:center;
      box-shadow:0 25px 80px #0005;
    }

    .profile-logo{
      width:96px;
      height:96px;
      margin:0 auto 18px;
      border-radius:50%;
      background:#171717;
      display:grid;
      place-items:center;
      overflow:hidden;
      font-size:45px;
    }

    .profile-logo img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .profile-brand{
      color:#b1843d;
      font-size:14px;
      letter-spacing:.08em;
    }

    .profile-name{
      font-size:32px;
      margin:10px 0 5px;
    }

    .profile-category{
      color:#a17a3e;
      font-weight:700;
      font-size:18px;
    }

    .profile-description{
      color:#777;
      line-height:1.7;
      margin:18px 0 25px;
    }

    .profile-link{
      display:flex;
      align-items:center;
      gap:14px;
      padding:16px;
      margin:10px 0;
      border:1px solid #e2ded5;
      border-radius:14px;
      background:#fff;
      color:#171717;
      text-decoration:none;
      transition:.2s;
    }

    .profile-link:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 25px #0001;
    }

    .profile-icon{
      width:42px;
      height:42px;
      min-width:42px;
      border-radius:10px;
      background:#f3efe7;
      display:grid;
      place-items:center;
      font-size:20px;
    }

    .profile-link-text{
      text-align:left;
      font-weight:800;
      flex:1;
    }

    .profile-link-sub{
      display:block;
      font-size:11px;
      color:#888;
      font-weight:500;
      margin-top:3px;
    }

    .copy-iban{
      border:0;
      background:#171717;
      color:#fff;
      padding:9px 12px;
      border-radius:7px;
      font-size:11px;
      cursor:pointer;
    }

    .profile-footer{
      margin-top:28px;
      font-size:10px;
      letter-spacing:.18em;
      color:#a17a3e;
    }

  </style>
</head>


<body>

<main class="profile">

  <div class="profile-wrap">

    <div class="profile-box" id="profileBox">

      <div class="profile-logo" id="logo">
        🦁
      </div>

      <div class="profile-brand">
        LEO CONNECT
      </div>

      <h1
        class="profile-name"
        id="businessName"
      >
        Yükleniyor...
      </h1>

      <div
        class="profile-category"
        id="category"
      ></div>

      <p
        class="profile-description"
        id="description"
      ></p>

      <div id="links"></div>

      <div
        class="profile-footer"
      >
        DOKUN • BAĞLAN • KEŞFET • BÜYÜT
      </div>

    </div>

  </div>

</main>


<script>

const slug =
  window.location.pathname
    .split("/")
    .filter(Boolean)
    .pop();


async function track(type){

  try{

    await fetch(
      "/api/event/" + slug,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          type:type
        })
      }
    );

  }catch(e){

    console.log("Tracking error:",e);

  }

}


async function loadProfile(){

  try{

    const response =
      await fetch(
        "/api/profile/" + slug
      );


    const business =
      await response.json();


    if(!response.ok){

      document.getElementById(
        "profileBox"
      ).innerHTML =
        "<h2>Profil bulunamadı</h2>";

      return;

    }


    document.getElementById(
      "businessName"
    ).textContent =
      business.name || "İşletme";


    document.getElementById(
      "category"
    ).textContent =
      business.category || "";


    document.getElementById(
      "description"
    ).textContent =
      business.description || "";


    /* LOGO */

    if(business.logo_url){

      const logo =
        document.getElementById("logo");

      logo.innerHTML =
        '<img src="' +
        business.logo_url +
        '" alt="İşletme logosu">';

    }


    const links =
      document.getElementById("links");


    function addLink(
      icon,
      title,
      url,
      eventType,
      subtitle
    ){

      if(
        !url ||
        url === "#"
      ) return;


      const a =
        document.createElement("a");


      a.className =
        "profile-link";


      a.href =
        url;


      if(
        !url.startsWith("tel:")
      ){

        a.target="_blank";
        a.rel="noopener noreferrer";

      }


      a.innerHTML =
        '<div class="profile-icon">' +
        icon +
        '</div>' +

        '<div class="profile-link-text">' +
        title +

        (
          subtitle
            ? '<span class="profile-link-sub">' +
              subtitle +
              '</span>'
            : ''
        ) +

        '</div>';


      a.addEventListener(
        "click",
        function(){

          track(eventType);

        }
      );


      links.appendChild(a);

    }


    /* TELEFON */

    if(business.phone){

      addLink(
        "📞",
        "Telefon",
        "tel:" + business.phone,
        "phone"
      );

    }


    /* WHATSAPP */

    if(business.whatsapp){

      let whatsapp =
        business.whatsapp;


      if(
        !whatsapp.includes("http")
      ){

        let number =
          whatsapp.replace(/\D/g,"");


        if(
          !number.startsWith("90")
        ){

          number =
            "90" + number;

        }


        whatsapp =
          "https://wa.me/" +
          number;

      }


      addLink(
        "💬",
        "WhatsApp",
        whatsapp,
        "whatsapp",
        "WhatsApp'tan mesaj gönder"
      );

    }


    /* KONUM */

    if(business.address){

      addLink(
        "📍",
        "Konum / Yol Tarifi",
        business.address,
        "location"
      );

    }


    /* INSTAGRAM */

    if(business.instagram){

      addLink(
        "◎",
        "Instagram",
        business.instagram,
        "instagram"
      );

    }


    /* TIKTOK */

    if(business.tiktok){

      addLink(
        "♪",
        "TikTok",
        business.tiktok,
        "tiktok"
      );

    }


    /* GOOGLE YORUM */

    if(business.google_review){

      addLink(
        "⭐",
        "Google'da Değerlendir",
        business.google_review,
        "google_review",
        "Bizi Google'da değerlendir"
      );

    }


    /* WEB SİTESİ */

    if(business.website){

      addLink(
        "🌐",
        "Web Sitesi",
        business.website,
        "website"
      );

    }


    /* MENÜ */

    if(business.menu){

      addLink(
        "🍽️",
        "Menüyü Gör",
        business.menu,
        "menu"
      );

    }


    /* IBAN */

    if(business.iban){

      const row =
        document.createElement("div");


      row.className =
        "profile-link";


      const holder =
        business.iban_holder
          ? '<span class="profile-link-sub">' +
            business.iban_holder +
            '</span>'
          : '';


      row.innerHTML =
        '<div class="profile-icon">🏦</div>' +

        '<div class="profile-link-text">' +
        'IBAN' +
        holder +
        '</div>' +

        '<button class="copy-iban">' +
        'Kopyala' +
        '</button>';


      const button =
        row.querySelector(
          ".copy-iban"
        );


      button.onclick =
        async function(){

          try{

            await navigator.clipboard.writeText(
              business.iban
            );


            this.textContent =
              "Kopyalandı ✓";


            track("iban");

          }catch(e){

            alert(
              "IBAN: " +
              business.iban
            );

          }

        };


      links.appendChild(row);

    }


    /* ÇALIŞMA SAATLERİ */

    if(business.hours){

      const hours =
        document.createElement("div");


      hours.className =
        "profile-link";


      hours.innerHTML =
        '<div class="profile-icon">🕐</div>' +

        '<div class="profile-link-text">' +
        'Çalışma Saatleri' +

        '<span class="profile-link-sub">' +
        business.hours +
        '</span>' +

        '</div>';


      links.appendChild(hours);

    }

  }catch(error){

    console.error(error);


    document.getElementById(
      "profileBox"
    ).innerHTML =

      "<h2>Bir hata oluştu</h2>" +

      "<p>" +
      "Lütfen daha sonra tekrar deneyin." +
      "</p>";

  }

}


loadProfile();

</script>

</body>
</html>
