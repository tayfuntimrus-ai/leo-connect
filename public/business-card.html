<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LEO CONNECT • Digital Business Card</title><style>:root{--bg:#050605;--panel:#101211;--panel2:#151816;--line:#292d2b;--text:#f5f5ef;--muted:#9fa59f;--gold:#d4af37;--gold2:#f0d77b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#202219,#070807 48%,#030403);color:var(--text);font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(700px,100%);margin:auto;padding:18px 12px 40px}.card{overflow:hidden;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,.015));box-shadow:0 30px 90px rgba(0,0,0,.42)}.cover{height:230px;background:linear-gradient(135deg,#29291f,#0a0b0a);position:relative;background-size:cover;background-position:center}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.84))}.avatar{position:absolute;z-index:2;left:50%;bottom:-48px;transform:translateX(-50%);width:100px;height:100px;border-radius:28px;border:2px solid rgba(212,175,55,.8);background:#0b0c0b;overflow:hidden;display:grid;place-items:center;font-size:42px;box-shadow:0 15px 45px rgba(0,0,0,.55)}.avatar img{width:100%;height:100%;object-fit:cover}.body{padding:70px 22px 28px;text-align:center}.ey{font-size:9px;letter-spacing:.24em;color:var(--gold);font-weight:900}.name{font-size:35px;line-height:1.05;margin:9px 0 6px}.job{font-size:15px;font-weight:800}.company{font-size:13px;color:var(--gold);margin-top:5px}.bio{max-width:570px;margin:16px auto 0;color:#c7cbc6;line-height:1.65;font-size:14px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:23px}.action{min-height:54px;border:1px solid var(--line);border-radius:15px;background:var(--panel);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:13px}.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#17140a;border:0}.section{margin-top:15px;padding:18px;text-align:left;border:1px solid var(--line);border-radius:20px;background:rgba(0,0,0,.15)}.st{font-size:10px;letter-spacing:.16em;color:var(--gold);font-weight:900;margin-bottom:10px}.rows{display:grid;gap:8px}.row{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid rgba(255,255,255,.05);border-radius:13px;background:var(--panel2)}.ico{width:34px;height:34px;border-radius:10px;background:#0b0d0c;display:grid;place-items:center}.rv{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.val{font-size:13px;font-weight:750;margin-top:2px;overflow-wrap:anywhere}.footer{text-align:center;color:#6f756f;font-size:9px;letter-spacing:.12em;margin-top:22px}.hidden{display:none!important}@media(max-width:520px){.wrap{padding:8px 8px 25px}.cover{height:190px}.name{font-size:29px}.actions{grid-template-columns:1fr}.body{padding-left:16px;padding-right:16px}}</style></head><body><div class="wrap"><main class="card"><div id="cover" class="cover"><div id="avatar" class="avatar">👤</div></div><div class="body"><div class="ey">LEO CONNECT • PERSONAL DIGITAL BUSINESS CARD</div><h1 id="name" class="name">Yükleniyor…</h1><div id="job" class="job"></div><div id="company" class="company"></div><div id="bio" class="bio"></div><div id="actions" class="actions"></div><section id="linksSection" class="section hidden"><div class="st">İLETİŞİM & BAĞLANTILAR</div><div id="links" class="rows"></div></section><div class="footer">POWERED BY LEO CONNECT</div></div></main></div><script>const slug=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');let card=null;const meta={phone:['Telefon','📞'],whatsapp:['WhatsApp','💬'],email:['E-posta','✉️'],website:['Web Sitesi','🌐'],address:['Adres','📍'],instagram:['Instagram','◎'],facebook:['Facebook','f'],tiktok:['TikTok','♪'],linkedin:['LinkedIn','in'],youtube:['YouTube','▶'],x:['X / Twitter','𝕏']};function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function url(v){try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:''}catch(e){return ''}}function row(k,v){if(!v)return '';const m=meta[k]||[k,'•'];let h=esc(v),u=url(v);if(k==='phone')h=`<a href="tel:${esc(v)}">${esc(v)}</a>`;else if(k==='email')h=`<a href="mailto:${esc(v)}">${esc(v)}</a>`;else if(k==='whatsapp'){const w=v.startsWith('http')?v:'https://wa.me/'+v.replace(/\D/g,'');h=`<a href="${esc(w)}" target="_blank" rel="noopener">${esc(v)}</a>`}else if(u)h=`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(v)}</a>`;return `<div class="row"><div class="ico">${m[1]}</div><div><div class="rv">${esc(m[0])}</div><div class="val">${h}</div></div></div>`}function vcard(){const d=card.data||{};let a=['BEGIN:VCARD','VERSION:3.0',`FN:${(d.person_name||d.display_name||'').replace(/([\\,;])/g,'\\$1')}`];if(d.job_title)a.push(`TITLE:${d.job_title}`);if(d.company)a.push(`ORG:${d.company}`);if(d.phone)a.push(`TEL;TYPE=CELL:${d.phone}`);if(d.email)a.push(`EMAIL:${d.email}`);if(d.website)a.push(`URL:${d.website}`);a.push('END:VCARD');return a.join('\r\n')}function addVcard(){const b=new Blob([vcard()],{type:'text/vcard;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=(card.data.person_name||'contact')+'.vcf';a.click();URL.revokeObjectURL(u)}function render(){const d=card.data||{};document.title=(d.display_name||d.person_name||'Digital Business Card')+' • LEO CONNECT';document.getElementById('name').textContent=d.display_name||d.person_name||'Digital Business Card';document.getElementById('job').textContent=d.job_title||'';document.getElementById('company').textContent=d.company||'';document.getElementById('bio').textContent=d.bio||d.note||'';if(d.photo_url)document.getElementById('avatar').innerHTML=`<img src="${esc(d.photo_url)}" alt="Profil fotoğrafı">`;if(d.cover_url)document.getElementById('cover').style.backgroundImage=`url("${esc(d.cover_url)}")`;const a=[];if(d.phone)a.push(`<a class="action gold" href="tel:${esc(d.phone)}">📞 Ara</a>`);if(d.whatsapp)a.push(`<a class="action" href="${esc(d.whatsapp.startsWith('http')?d.whatsapp:'https://wa.me/'+d.whatsapp.replace(/\D/g,''))}" target="_blank" rel="noopener">💬 WhatsApp</a>`);a.push(`<button class="action" onclick="addVcard()">👤 Kişilere Ekle</button>`);if(navigator.share)a.push(`<button class="action" onclick="navigator.share({title:document.title,url:location.href})">↗ Paylaş</button>`);document.getElementById('actions').innerHTML=a.join('');const order=['email','website','address','instagram','facebook','tiktok','linkedin','youtube','x'];const html=order.map(k=>row(k,d[k])).filter(Boolean).join('');if(html){document.getElementById('links').innerHTML=html;document.getElementById('linksSection').classList.remove('hidden')}}async function init(){try{const r=await fetch('/api/public-card/'+encodeURIComponent(slug));const d=await r.json();if(!r.ok)throw new Error(d.error||'Kart bulunamadı');card=d.card;render()}catch(e){document.getElementById('name').textContent='Business Card bulunamadı';document.getElementById('bio').textContent=e.message}}init();</script></body></html>
