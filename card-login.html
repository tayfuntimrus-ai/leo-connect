<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEO CONNECT • Business Card Giriş</title><style>:root{--bg:#070807;--panel:#101211;--line:#292d2b;--text:#f5f5ef;--muted:#9fa59f;--gold:#d4af37}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#191b17,#070807 55%,#040504);color:var(--text);font-family:Inter,system-ui,sans-serif}.box{width:min(430px,calc(100% - 28px));padding:30px;border:1px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:0 25px 70px rgba(0,0,0,.4)}.logo{text-align:center;font-size:48px}.ey{text-align:center;color:var(--gold);font-size:10px;letter-spacing:.22em;font-weight:800}.h{text-align:center;font-size:27px;margin:10px 0 6px}.sub{text-align:center;color:var(--muted);font-size:11px;margin-bottom:24px}.f{margin:12px 0}.f label{display:block;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:1px;margin-bottom:6px}.f input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:#151816;color:var(--text);outline:none}.btn{width:100%;padding:13px;border:0;border-radius:11px;background:linear-gradient(135deg,#d4af37,#f0d77b);font-weight:800;color:#17140a;margin-top:8px;cursor:pointer}.err{min-height:18px;color:#ff7777;text-align:center;font-size:11px;margin-top:10px}</style></head><body><main class="box"><div class="logo">🦁</div><div class="ey">LEO CONNECT</div><h1 class="h">Business Card</h1><div class="sub">Kişisel dijital kart yönetimi</div><div class="f"><label>E-POSTA</label><input id="email" type="email" autocomplete="username"></div><div class="f"><label>ŞİFRE</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" onclick="login()">KARTA GİRİŞ YAP</button><div id="err" class="err"></div></main><script>async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;try{const r=await fetch('/api/card-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Giriş başarısız');localStorage.setItem('card_token',d.token);location.href='/card-dashboard'}catch(e){document.getElementById('err').textContent=e.message}}</script></body></html>
