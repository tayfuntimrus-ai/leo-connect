<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEO CONNECT • Card Dashboard</title><style>:root{--bg:#070807;--panel:#101211;--panel2:#151816;--line:#292d2b;--text:#f5f5ef;--muted:#9fa59f;--gold:#d4af37;--gold2:#f0d77b;--danger:#ff7777}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.top{height:72px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 24px;position:sticky;top:0;background:rgba(7,8,7,.92);backdrop-filter:blur(14px);z-index:5}.brand{font-weight:900;letter-spacing:1.5px}.brand span{color:var(--gold)}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:10px;font-weight:700;cursor:pointer}.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#17140a;border:0}.wrap{width:min(1180px,100%);margin:auto;padding:28px 18px 50px}.head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:20px}.ey{color:var(--gold);font-size:9px;letter-spacing:.22em;font-weight:800}.h{font-size:34px;margin:8px 0 4px}.sub{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.panel{border:1px solid var(--line);background:linear-gradient(145deg,var(--panel),var(--panel2));border-radius:20px;padding:20px}.panel h2{font-size:15px;margin:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}.f.full{grid-column:1/-1}.f label{display:block;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.8px;margin-bottom:5px}.f input,.f textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#0e100f;color:var(--text);outline:none}.f textarea{min-height:90px;resize:vertical}.locked{opacity:.45}.hint{font-size:9px;color:var(--muted);margin-top:12px}.preview{min-height:520px;display:grid;place-items:center;background:radial-gradient(circle at top,#25251c,#0a0b0a 60%);border-radius:16px;border:1px solid var(--line);padding:20px}.mini{width:min(360px,100%);overflow:hidden;border:1px solid #333;border-radius:26px;background:#111411;box-shadow:0 25px 70px rgba(0,0,0,.45)}.cover{height:130px;background:linear-gradient(135deg,#24261f,#0d0f0e)}.pbody{text-align:center;padding:55px 18px 24px;position:relative}.avatar{position:absolute;top:-42px;left:50%;transform:translateX(-50%);width:84px;height:84px;border-radius:24px;background:#0c0e0d;border:2px solid var(--gold);overflow:hidden;display:grid;place-items:center;font-size:35px}.avatar img{width:100%;height:100%;object-fit:cover}.pname{font-size:23px;font-weight:900}.job{font-size:12px;color:var(--muted);margin-top:4px}.company{font-size:12px;color:var(--gold);margin-top:5px}.links{display:grid;gap:7px;margin-top:18px}.link{padding:10px;border:1px solid var(--line);border-radius:11px;font-size:11px}.save{margin-top:16px;width:100%}.toast{position:fixed;right:18px;bottom:18px;padding:11px 14px;border:1px solid rgba(212,175,55,.4);background:var(--panel);border-radius:11px;display:none;font-size:11px}.toast.show{display:block}@media(max-width:850px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.f.full{grid-column:auto}.head{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="top"><div class="brand">🦁 LEO <span>CONNECT</span> • BUSINESS CARD</div><div class="actions"><button class="btn" onclick="window.open('/card/'+(person?.slug||''),'_blank')">Kartı Gör</button><button class="btn" onclick="logout()">Çıkış</button></div></header><main class="wrap"><div class="head"><div><div class="ey">PERSONAL DIGITAL CARD</div><h1 class="h">Kartını Yönet</h1><div class="sub">Admin tarafından verilen alan yetkilerine göre bilgilerini düzenleyebilirsin.</div></div></div><div class="grid"><section class="panel"><h2>Bilgiler</h2><div id="fields" class="fields">Yükleniyor…</div><div class="hint">🔒 Admin tarafından kapatılan alanlar değiştirilemez.</div><button class="btn gold save" onclick="save()">Değişiklikleri Kaydet</button></section><section class="panel"><h2>Canlı Önizleme</h2><div class="preview"><div class="mini"><div class="cover"></div><div class="pbody"><div id="avatar" class="avatar">👤</div><div id="pn" class="pname">—</div><div id="pj" class="job"></div><div id="pc" class="company"></div><div id="links" class="links"></div></div></div></div></section></div></main><div id="toast" class="toast"></div><script>const token=localStorage.getItem('card_token');let person=null;const fields=[['person_name','Ad Soyad'],['display_name','Kart Başlığı'],['job_title','Unvan'],['company','Şirket / Kurum'],['phone','Telefon'],['whatsapp','WhatsApp'],['email','E-posta'],['website','Web Sitesi'],['address','Adres'],['instagram','Instagram'],['facebook','Facebook'],['tiktok','TikTok'],['linkedin','LinkedIn'],['youtube','YouTube'],['x','X / Twitter'],['photo_url','Profil Fotoğrafı'],['cover_url','Kapak Görseli'],['bio','Hakkımda'],['note','Not / Kısa Açıklama']];function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(u,o);const d=await r.json();if(r.status===401){logout();return null}if(!r.ok)throw new Error(d.error||'İşlem başarısız');return d}function render(){const d=person.data||{},p=person.permissions||{};document.getElementById('fields').innerHTML=fields.map(([k,l])=>{const allowed=p[k]===true;return `<div class="f ${['bio','note'].includes(k)?'full':''} ${allowed?'':'locked'}"><label>${esc(l)} ${allowed?'':'• KİLİTLİ'}</label>${['bio','note'].includes(k)?`<textarea data-k="${k}" ${allowed?'':'disabled'}>${esc(d[k]||'')}</textarea>`:`<input data-k="${k}" value="${esc(d[k]||'')}" ${allowed?'':'disabled'}`}></div>`}).join('');document.getElementById('pn').textContent=d.person_name||d.display_name||'Ad Soyad';document.getElementById('pj').textContent=d.job_title||'';document.getElementById('pc').textContent=d.company||'';document.getElementById('links').innerHTML=fields.filter(([k])=>['phone','whatsapp','email','website','linkedin','instagram'].includes(k)&&d[k]&&p[k]).map(([k,l])=>`<div class="link">${esc(l)} • ${esc(d[k])}</div>`).join('');if(d.photo_url)document.getElementById('avatar').innerHTML=`<img src="${esc(d.photo_url)}">`}async function save(){const body={};document.querySelectorAll('[data-k]:not(:disabled)').forEach(x=>body[x.dataset.k]=x.value);try{const r=await api('/api/card/me',{method:'PUT',body:JSON.stringify(body)});person=r.person;render();toast('Kart bilgileri kaydedildi.')}catch(e){toast(e.message)}}function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}function logout(){localStorage.removeItem('card_token');location.href='/card-login'}async function init(){if(!token)return logout();try{const d=await api('/api/card/me');if(d){person=d.person;render()}}catch(e){toast(e.message)}}init();</script></body></html>
